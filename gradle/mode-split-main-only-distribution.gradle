import java.util.zip.ZipFile

// This script deliberately has no addon project references.  It is loaded
// for every root build, including a checkout where the addon does not exist.
def mainOnlyDistributionRoot = layout.buildDirectory.dir(
        "distributions/codpattern-main-${project.version}")
def mainOnlyReobfJar = layout.buildDirectory.file('reobfJar/output.jar')
def mainOnlyArtifactName = "codpattern-${project.version}.jar"

def normalizeMainOnlyModsDir = { Object rawValue ->
    String raw = rawValue?.toString()?.trim()
    if (raw == null || raw.isEmpty()) {
        return null
    }
    def winMatcher = (raw =~ /^([A-Za-z]):[\\\/](.*)$/)
    if (winMatcher.matches()) {
        return "/mnt/${winMatcher[0][1].toLowerCase()}/${winMatcher[0][2].replace('\\', '/')}"
    }
    raw
}

def validateMainOnlyJar = { File artifact, String label ->
    if (!artifact.isFile() || artifact.length() == 0L) {
        throw new GradleException("${label} is missing or empty: ${artifact}")
    }
    ZipFile zip = new ZipFile(artifact)
    try {
        Set<String> entries = Collections.list(zip.entries())*.name.toSet()
        if (!entries.contains('META-INF/mods.toml')) {
            throw new GradleException("${label} is missing META-INF/mods.toml: ${artifact}")
        }
        if (entries.any { entry ->
            entry.startsWith('com/cdp/codpattern/zombiesaddon/') ||
                    entry.startsWith('com/cdp/codpattern/app/zombies/') ||
                    entry.startsWith('com/phasetranscrystal/fpsmatch/common/packet/Zombies') ||
                    entry.startsWith('assets/codpattern_zombies/')
        }) {
            throw new GradleException("${label} embeds Zombies addon implementation classes: ${artifact}")
        }
        String modsToml = new String(zip.getInputStream(zip.getEntry('META-INF/mods.toml')).readAllBytes(), 'UTF-8')
        if (!modsToml.contains('modId="codpattern"') || modsToml.contains('modId="codpattern_zombies"')) {
            throw new GradleException("${label} does not contain only the codpattern mod metadata: ${artifact}")
        }
    } finally {
        zip.close()
    }
}

tasks.register('prepareMainOnlyDistribution', Sync) {
    group = 'distribution'
    description = 'Prepare a distribution containing only the reobfuscated main mod JAR.'
    dependsOn tasks.named('reobfJar')
    from(mainOnlyReobfJar)
    into(mainOnlyDistributionRoot)
    rename { mainOnlyArtifactName }
}

tasks.register('verifyMainOnlyDistribution') {
    group = 'verification'
    description = 'Verify the independent main-only distribution and its main mod JAR.'
    dependsOn tasks.named('prepareMainOnlyDistribution')
    inputs.file(mainOnlyReobfJar)
    inputs.dir(mainOnlyDistributionRoot)
    doLast {
        File distribution = mainOnlyDistributionRoot.get().asFile
        Set<String> entries = (distribution.listFiles() ?: [] as File[])*.name.toSet()
        if (entries != [mainOnlyArtifactName] as Set) {
            throw new GradleException(
                    "Main-only distribution contents drift: expected=${[mainOnlyArtifactName]}, actual=${entries}")
        }
        validateMainOnlyJar(new File(distribution, mainOnlyArtifactName), 'Main-only distribution JAR')
        println "Main-only distribution passed: ${mainOnlyArtifactName}"
    }
}

def mainOnlyDeploymentCandidates = { File modsDir ->
    (modsDir.listFiles() ?: [] as File[]).findAll { File candidate ->
        candidate.isFile() && (
                candidate.name ==~ /codpattern-(?!zombies-).+\.jar/ ||
                        candidate.name ==~ /codpattern-zombies-.+\.jar/)
    }
}

tasks.register('deploySplitMainOnly') {
    group = 'distribution'
    description = 'Replace scoped codPattern artifacts with the verified main-only JAR.'
    dependsOn tasks.named('verifyMainOnlyDistribution')
    doLast {
        Object rawModsDir = findProperty('modsDir') ?: System.getenv('MODS_DIR')
        if (rawModsDir == null || rawModsDir.toString().trim().isEmpty()) {
            throw new GradleException('modsDir not set. Supply -PmodsDir=<existing Minecraft mods directory>.')
        }
        String normalizedModsDir = normalizeMainOnlyModsDir(rawModsDir)?.toString()
        File modsDir = file(normalizedModsDir).canonicalFile
        if (!modsDir.isDirectory()) {
            throw new GradleException("modsDir does not exist or is not a directory: ${modsDir}")
        }
        List<File> stale = mainOnlyDeploymentCandidates(modsDir)
        delete(stale)
        copy {
            from new File(mainOnlyDistributionRoot.get().asFile, mainOnlyArtifactName)
            into modsDir
        }
        println "Deployed main-only artifact to ${modsDir}; replaced ${stale*.name.sort()}"
    }
}
