import java.util.regex.Pattern

def modeSplitStaticTestLedger = layout.projectDirectory.file(
        'docs/mode-split/phase0/static-contract-test-migration-ledger.tsv')
def modeSplitTestJavaRoots = providers.provider {
    String configured = (findProperty('modeSplitTestJavaRoots') ?: '').toString().trim()
    if (configured.isEmpty()) {
        List<File> defaults = [file('src/test/java')]
        Project addonProject = rootProject.findProject(':zombies-addon')
        if (addonProject != null) {
            defaults.add(addonProject.file('src/test/java'))
        }
        configured = defaults*.absolutePath.join(File.pathSeparator)
    }
    configured.split(Pattern.quote(File.pathSeparator), -1)
            .findAll { !it.isBlank() }
            .collect { file(it) }
}

