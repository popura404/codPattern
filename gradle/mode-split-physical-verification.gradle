tasks.register('verifySplitBytecodeFence') {
    group = 'verification'
    description = 'Verify main modules, bytecode, metadata, and resources have no addon implementation edge.'
    inputs.files(splitPhysicalOverlay, splitPackageRelocations)
    doLast {
        requireTargetStage()
        File mainJar = requireSplitJar('modeSplitMainJar', 'Main reobfuscated JAR')
        File addonJar = requireSplitJar('modeSplitAddonJar', 'Addon reobfuscated JAR')
        List<Map> javaRows = readOverlayRows(splitPhysicalOverlay.asFile)
                .findAll { it.oldPath.startsWith('src/main/java/') }
        Set<String> addonInternalNames = javaRows.findAll { it.owner == 'ZOMBIES_ADDON' }
                .collect { expectedClassEntry(it).replaceAll(/\.class$/, '') }.toSet()
        Set<String> mainTopLevelEntries = javaRows.findAll { it.owner == 'FUTURE_MAIN' }
                .collect(expectedClassEntry).toSet()
        Set<String> addonEntries = zipEntries(addonJar)
        Set<String> copiedMain = mainTopLevelEntries.intersect(addonEntries)
        if (!copiedMain.isEmpty()) {
            throw new GradleException("Addon JAR embeds main classes: ${copiedMain}")
        }

        Map<String, List<String>> leaks = scanJarForAddonReferences(mainJar, addonInternalNames)
        if (!leaks.bytecode.isEmpty()) {
            throw new GradleException(
                    "Main bytecode references addon implementations: ${leaks.bytecode}")
        }
        if (!leaks.resources.isEmpty()) {
            throw new GradleException(
                    "Main metadata/resources reference addon implementations: ${leaks.resources}")
        }

        Project addonProject = rootProject.findProject(':zombies-addon')
        if (addonProject == null) {
            throw new GradleException('Target stage is missing the :zombies-addon project')
        }
        for (String configurationName : ['compileClasspath', 'runtimeClasspath']) {
            Set<String> mainProjects = resolvedProjectPaths(rootProject, configurationName)
            if (mainProjects.contains(addonProject.path)) {
                throw new GradleException(
                        "Main ${configurationName} depends on ${addonProject.path}: ${mainProjects}")
            }
            Set<String> addonProjects = resolvedProjectPaths(addonProject, configurationName)
            if (addonProjects.contains(rootProject.path)) {
                throw new GradleException(
                        "Addon ${configurationName} must use the local output bridge, not " +
                                "a ProjectDependency on ${rootProject.path}: ${addonProjects}")
            }
        }
        def rootClasses = rootProject.tasks.named('classes').get()
        def addonCompileJava = addonProject.tasks.named('compileJava').get()
        Set<Task> addonCompileDependencies = addonCompileJava.taskDependencies
                .getDependencies(addonCompileJava)
        if (!addonCompileDependencies.contains(rootClasses)) {
            throw new GradleException(
                    'Addon compileJava must depend on root :classes through the local output bridge')
        }
        Set<File> expectedRootOutput = rootProject.sourceSets.main.output.files.collect {
            it.canonicalFile
        }.toSet()
        Set<File> addonCompileClasspath = addonProject.sourceSets.main.compileClasspath.files.collect {
            it.canonicalFile
        }.toSet()
        if (!addonCompileClasspath.containsAll(expectedRootOutput)) {
            throw new GradleException(
                    "Addon compile classpath is missing root main output bridge: " +
                            "expected=${expectedRootOutput}, actual=${addonCompileClasspath}")
        }
        println "Split module/content fence passed: main dependency graphs exclude addon, addon " +
                'uses the compile-only root output bridge without a ProjectDependency, and ' +
                "${addonInternalNames.size()} addon implementation names are absent from main " +
                'bytecode, metadata, and resources'
    }
}

