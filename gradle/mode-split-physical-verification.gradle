tasks.register('prepareSplitDistribution') {
    group = 'distribution'
    description = 'Preserve the verified split JARs, checksums, installation guide, and Gradle evidence.'
    dependsOn tasks.named('reobfJar')
    dependsOn project(':zombies-addon').tasks.named('reobfJar')
    inputs.file(layout.buildDirectory.file('reobfJar/output.jar'))
    inputs.file(project(':zombies-addon').layout.buildDirectory.file('reobfJar/output.jar'))
    inputs.file(splitInstallationGuide)
    outputs.dir(splitDistributionRoot)
    outputs.dir(splitRound6EvidenceRoot)
    doLast {
        File mainJar = layout.buildDirectory.file('reobfJar/output.jar').get().asFile
        File addonJar = project(':zombies-addon').layout.buildDirectory
                .file('reobfJar/output.jar').get().asFile
        validateSplitJar(mainJar, 'Main reobfuscated JAR')
        validateSplitJar(addonJar, 'Addon reobfuscated JAR')

        File output = splitDistributionRoot.get().asFile
        File expectedParent = layout.buildDirectory.dir('distributions').get().asFile.canonicalFile
        if (output.canonicalFile.parentFile != expectedParent) {
            throw new GradleException("Refusing to replace unexpected distribution path: ${output}")
        }
        delete output
        output.mkdirs()

        String mainName = "codpattern-${project.version}.jar"
        String addonName = "codpattern-zombies-${project.version}.jar"
        copy {
            from mainJar
            into output
            rename { mainName }
        }
        copy {
            from addonJar
            into output
            rename { addonName }
        }
        copy {
            from splitInstallationGuide
            into output
        }

        File evidence = splitRound6EvidenceRoot.get().asFile
        File expectedEvidenceParent = layout.buildDirectory
                .dir('mode-split/round6').get().asFile.canonicalFile
        if (evidence.canonicalFile.parentFile != expectedEvidenceParent) {
            throw new GradleException("Refusing to replace unexpected evidence path: ${evidence}")
        }
        delete evidence
        evidence.mkdirs()
        copy {
            from project(':zombies-addon').file('build.gradle')
            into evidence
            rename { 'zombies-addon-build.gradle.verification' }
        }
        File copiedMain = new File(output, mainName)
        File copiedAddon = new File(output, addonName)
        new File(output, 'SHA256SUMS.txt').setText(
                "${sha256(copiedMain)}  ${mainName}\n" +
                        "${sha256(copiedAddon)}  ${addonName}\n",
                'UTF-8')
        new File(evidence, 'verification-artifacts.properties').setText(
                "main.source=${mainJar.absolutePath}\n" +
                "main.sha256=${sha256(mainJar)}\n" +
                "addon.source=${addonJar.absolutePath}\n" +
                "addon.sha256=${sha256(addonJar)}\n" +
                'addon.compile.bridge=compileOnly rootProject.sourceSets.main.output\n',
                'UTF-8')
        println "Prepared split distribution evidence at ${output}"
    }
}

tasks.register('verifySplitDistributionContents') {
    group = 'verification'
    description = 'Verify the preserved split distribution contains only approved artifacts and evidence.'
    dependsOn tasks.named('prepareSplitDistribution')
    doLast {
        File output = splitDistributionRoot.get().asFile
        String mainName = "codpattern-${project.version}.jar"
        String addonName = "codpattern-zombies-${project.version}.jar"
        Set<String> expected = [
                mainName,
                addonName,
                'SHA256SUMS.txt',
                'SPLIT_INSTALLATION_AND_UPGRADE.md'
        ] as Set
        Set<String> actual = fileTree(output).files.collect { File entry ->
            output.toPath().relativize(entry.toPath()).toString().replace('\\', '/')
        }.toSet()
        if (actual != expected) {
            throw new GradleException(
                    "Split distribution contents drift: missing=${expected - actual}, unexpected=${actual - expected}")
        }
        List<String> checksums = new File(output, 'SHA256SUMS.txt').readLines('UTF-8')
        Map<String, String> expectedHashes = [
                (mainName): sha256(new File(output, mainName)),
                (addonName): sha256(new File(output, addonName))
        ]
        for (String line : checksums) {
            String[] fields = line.split('  ', 2)
            if (fields.length != 2 || expectedHashes[fields[1]] != fields[0]) {
                throw new GradleException("Invalid split distribution checksum row: ${line}")
            }
            expectedHashes.remove(fields[1])
        }
        if (!expectedHashes.isEmpty()) {
            throw new GradleException("Missing split distribution checksums: ${expectedHashes.keySet()}")
        }
        File evidence = splitRound6EvidenceRoot.get().asFile
        Set<String> expectedEvidence = [
                'zombies-addon-build.gradle.verification',
                'verification-artifacts.properties'
        ] as Set
        Set<String> actualEvidence = fileTree(evidence).files.collect { File entry ->
            evidence.toPath().relativize(entry.toPath()).toString().replace('\\', '/')
        }.toSet()
        if (actualEvidence != expectedEvidence) {
            throw new GradleException(
                    "Split verification evidence drift: missing=${expectedEvidence - actualEvidence}, " +
                            "unexpected=${actualEvidence - expectedEvidence}")
        }
        Properties evidenceProperties = new Properties()
        new File(evidence, 'verification-artifacts.properties').withInputStream {
            evidenceProperties.load(it)
        }
        File liveMain = layout.buildDirectory.file('reobfJar/output.jar').get().asFile
        File liveAddon = project(':zombies-addon').layout.buildDirectory
                .file('reobfJar/output.jar').get().asFile
        if (sha256(liveMain) != sha256(new File(output, mainName))
                || sha256(liveAddon) != sha256(new File(output, addonName))
                || evidenceProperties.getProperty('main.sha256') != sha256(liveMain)
                || evidenceProperties.getProperty('addon.sha256') != sha256(liveAddon)
                || evidenceProperties.getProperty('addon.compile.bridge')
                        != 'compileOnly rootProject.sourceSets.main.output') {
            throw new GradleException('Split distribution does not match live verified JARs or evidence')
        }
        println "Split distribution contents passed: ${mainName}, ${addonName}, checksums, guide; " +
                'verification evidence preserved outside the shipping directory'
    }
}

tasks.register('assembleSplitDistribution') {
    group = 'distribution'
    description = 'Assemble the verified two-JAR split distribution and evidence directory.'
    dependsOn tasks.named('verifySplitDistributionContents')
}

def splitDeploymentCandidates = { File modsDir ->
    (modsDir.listFiles() ?: [] as File[]).findAll { File candidate ->
        candidate.isFile() && (
                candidate.name ==~ /codpattern-(?!zombies-).+\.jar/ ||
                        candidate.name ==~ /codpattern-zombies-.+\.jar/)
    }
}

def installSplitArtifacts = { File modsDir, boolean includeAddon ->
    List<File> stale = splitDeploymentCandidates(modsDir)
    delete stale
    File distribution = splitDistributionRoot.get().asFile
    copy {
        from new File(distribution, "codpattern-${project.version}.jar")
        if (includeAddon) {
            from new File(distribution, "codpattern-zombies-${project.version}.jar")
        }
        into modsDir
    }
    stale
}

tasks.register('verifySplitDeploymentSelector') {
    group = 'verification'
    description = 'Prove scoped deployment replaces old split/combined JARs and preserves unrelated mods.'
    dependsOn tasks.named('assembleSplitDistribution')
    doLast {
        Closure<File> prepareSandbox = { String name ->
            File sandbox = new File(temporaryDir, name)
            delete sandbox
            sandbox.mkdirs()
            new File(sandbox, 'codpattern-0.7.5.jar').setText('old combined', 'UTF-8')
            new File(sandbox, 'codpattern-zombies-0.7.5.jar').setText('old addon', 'UTF-8')
            new File(sandbox, 'unrelated-example.jar').setText('preserve', 'UTF-8')
            sandbox
        }
        Closure<Set<String>> names = { File sandbox ->
            (sandbox.listFiles() ?: [] as File[])*.name.toSet()
        }
        String mainName = "codpattern-${project.version}.jar"
        String addonName = "codpattern-zombies-${project.version}.jar"

        File mainOnly = prepareSandbox('main-only')
        installSplitArtifacts(mainOnly, false)
        Set<String> mainOnlyNames = names(mainOnly)
        if (mainOnlyNames != [mainName, 'unrelated-example.jar'] as Set) {
            throw new GradleException("Main-only deployment selector drift: ${mainOnlyNames}")
        }

        File combined = prepareSandbox('combined')
        installSplitArtifacts(combined, true)
        Set<String> combinedNames = names(combined)
        if (combinedNames != [mainName, addonName, 'unrelated-example.jar'] as Set) {
            throw new GradleException("Combined deployment selector drift: ${combinedNames}")
        }
        println 'Split deployment selector passed: old main/addon removed, unrelated JAR preserved, ' +
                'main-only and combined sets exact'
    }
}

def registerSplitDeployment = { String taskName, boolean includeAddon ->
    tasks.register(taskName) {
        group = 'distribution'
        description = includeAddon
                ? 'Replace scoped codPattern artifacts with the verified main plus Zombies addon JARs.'
                : 'Replace scoped codPattern artifacts with the verified main-only JAR.'
        dependsOn tasks.named('assembleSplitDistribution')
        doLast {
            Object raw = findProperty('modsDir') ?: System.getenv('MODS_DIR')
            if (raw == null || raw.toString().trim().isEmpty()) {
                throw new GradleException(
                        "modsDir not set. Supply -PmodsDir=<existing Minecraft mods directory>.")
            }
            File modsDir = file(raw.toString().trim()).canonicalFile
            if (!modsDir.isDirectory()) {
                throw new GradleException("modsDir does not exist or is not a directory: ${modsDir}")
            }
            List<File> stale = installSplitArtifacts(modsDir, includeAddon)
            println "Deployed ${includeAddon ? 'combined split' : 'main-only'} artifacts to ${modsDir}; " +
                    "replaced ${stale*.name.sort()}"
        }
    }
}

registerSplitDeployment('deploySplitCombined', true)

