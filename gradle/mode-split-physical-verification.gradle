def validateSplitJar = { File artifact, String label ->
    if (!artifact.isFile() || artifact.length() == 0L) {
        throw new GradleException("${label} is missing or empty: ${artifact}")
    }
    ZipFile zip = null
    try {
        zip = new ZipFile(artifact)
        if (!zip.entries().hasMoreElements()) {
            throw new GradleException("${label} contains no entries: ${artifact}")
        }
    } catch (GradleException error) {
        throw error
    } catch (Exception error) {
        throw new GradleException("${label} is not a readable JAR: ${artifact}", error)
    } finally {
        zip?.close()
    }
    artifact
}

def requireSplitJar = { String propertyName, String label ->
    String configured = (findProperty(propertyName) ?: '').toString().trim()
    if (configured.isEmpty()) {
        throw new GradleException(
                "${label} is not configured. Supply -P${propertyName}=<reobfuscated-jar> in target stage.")
    }
    validateSplitJar(file(configured), label)
}

def requireTargetStage = {
    if (splitStage() != 'target') {
        throw new GradleException(
                "Target two-artifact verification requires -PmodeSplitVerificationStage=target; " +
                        "the current stage is '${splitStage()}'.")
    }
}

def zipEntries = { File artifact ->
    ZipFile zip = new ZipFile(artifact)
    try {
        Collections.list(zip.entries())
                .findAll { !it.directory }
                .collect { it.name }
                .toSet()
    } finally {
        zip.close()
    }
}

def scanJarForAddonReferences = { File artifact, Set<String> addonInternalNames ->
    Map<String, List<String>> leaks = [bytecode: [], resources: []]
    ZipFile zip = new ZipFile(artifact)
    try {
        Collections.list(zip.entries()).findAll { !it.directory }.each { entry ->
            byte[] bytes = zip.getInputStream(entry).withCloseable { it.readAllBytes() }
            String contents = new String(bytes, StandardCharsets.ISO_8859_1)
            for (String addonName : addonInternalNames) {
                String dottedName = addonName.replace('/', '.')
                if (contents.contains(addonName) || contents.contains(dottedName)) {
                    String evidence = entry.name + ' -> ' + addonName
                    if (entry.name.endsWith('.class')) {
                        leaks.bytecode.add(evidence)
                    } else {
                        leaks.resources.add(evidence)
                    }
                }
            }
        }
    } finally {
        zip.close()
    }
    leaks
}

def readZipEntry = { File artifact, String entryName ->
    ZipFile zip = new ZipFile(artifact)
    try {
        def entry = zip.getEntry(entryName)
        if (entry == null) {
            throw new GradleException("${artifact.name} is missing ${entryName}")
        }
        zip.getInputStream(entry).withCloseable { input ->
            new String(input.readAllBytes(), StandardCharsets.UTF_8)
        }
    } finally {
        zip.close()
    }
}

def tomlArrayBlocks = { String text, String header ->
    def pattern = java.util.regex.Pattern.compile(
            '(?ms)^\\s*\\[\\[' + java.util.regex.Pattern.quote(header) +
                    '\\]\\]\\s*$\\R?(.*?)(?=^\\s*\\[\\[|\\z)')
    def matcher = pattern.matcher(text)
    List<String> blocks = []
    while (matcher.find()) {
        blocks.add(matcher.group(1))
    }
    blocks
}

def tomlStringValue = { String block, String key ->
    def matcher = java.util.regex.Pattern.compile(
            '(?m)^\\s*' + java.util.regex.Pattern.quote(key) +
                    '\\s*=\\s*["\']([^"\']*)["\']\\s*(?:#.*)?$').matcher(block)
    matcher.find() ? matcher.group(1) : null
}

def tomlBooleanValue = { String block, String key ->
    def matcher = java.util.regex.Pattern.compile(
            '(?mi)^\\s*' + java.util.regex.Pattern.quote(key) +
                    '\\s*=\\s*(true|false)\\s*(?:#.*)?$').matcher(block)
    matcher.find() ? Boolean.valueOf(matcher.group(1)) : null
}

def resolvedProjectPaths = { Project project, String configurationName ->
    def configuration = project.configurations.findByName(configurationName)
    if (configuration == null || !configuration.canBeResolved) {
        throw new GradleException(
                "Missing resolvable ${project.path}:${configurationName} configuration")
    }
    configuration.incoming.resolutionResult.allComponents.collect { component ->
        def id = component.id
        id instanceof org.gradle.api.artifacts.component.ProjectComponentIdentifier
                ? id.projectPath
                : null
    }.findAll { it != null }.toSet()
}

def readOverlayRows = { File overlay ->
    if (!overlay.isFile()) {
        throw new GradleException("Missing physical-split overlay: ${overlay}")
    }
    overlay.readLines('UTF-8').findAll { raw ->
        !raw.isBlank() && !raw.startsWith('#')
    }.collect { raw ->
        String[] fields = raw.split('\t', -1)
        if (fields.length != 6) {
            throw new GradleException("Invalid physical-split overlay row: ${raw}")
        }
        [owner: fields[0], oldPath: fields[1], newPath: fields[2], kind: fields[3]]
    }
}

def readPackageRelocations = { File relocationFile ->
    if (!relocationFile.isFile()) {
        throw new GradleException("Missing authorized package relocation map: ${relocationFile}")
    }
    Map<String, String> relocations = [:]
    relocationFile.readLines('UTF-8').findAll { raw ->
        !raw.isBlank() && !raw.startsWith('#')
    }.each { raw ->
        String[] fields = raw.split('\t', -1)
        if (fields.length != 3 || fields[0].isBlank() || fields[1].isBlank()) {
            throw new GradleException("Invalid package relocation row: ${raw}")
        }
        relocations[fields[0]] = fields[1]
    }
    if (relocations.size() != 18) {
        throw new GradleException("Expected 18 authorized package relocations, found ${relocations.size()}")
    }
    relocations
}

def relocatedJavaPath = { String overlayPath ->
    String prefix = 'zombies-addon/src/main/java/'
    if (!overlayPath.startsWith(prefix) || !overlayPath.endsWith('.java')) {
        return overlayPath
    }
    String oldFqcn = overlayPath.substring(prefix.length(), overlayPath.length() - '.java'.length())
            .replace('/', '.')
    String relocatedFqcn = readPackageRelocations(splitPackageRelocations.asFile)[oldFqcn]
    relocatedFqcn == null
            ? overlayPath
            : prefix + relocatedFqcn.replace('.', '/') + '.java'
}

def physicalSplitPath = { String manifestPath ->
    String addonPrefix = 'zombies-addon/'
    if (manifestPath.startsWith(addonPrefix)) {
        Project addonProject = rootProject.findProject(':zombies-addon')
        if (addonProject == null) {
            throw new GradleException("Physical addon path requires :zombies-addon: ${manifestPath}")
        }
        return addonProject.file(manifestPath.substring(addonPrefix.length()))
    }
    file(manifestPath)
}

def expectedClassEntry = { Map row ->
    String targetPath = row.owner == 'ZOMBIES_ADDON'
            ? relocatedJavaPath(row.newPath)
            : row.newPath
    String prefix = row.owner == 'ZOMBIES_ADDON'
            ? 'zombies-addon/src/main/java/'
            : 'src/main/java/'
    if (!targetPath.startsWith(prefix) || !targetPath.endsWith('.java')) {
        throw new GradleException("Unexpected Java target path in physical overlay: ${row}")
    }
    targetPath.substring(prefix.length(), targetPath.length() - '.java'.length()) + '.class'
}

def expectedResourceEntries = { Map row ->
    if (row.kind == 'TEST_FIXTURE') {
        return []
    }
    if (row.owner == 'PARTITIONED_LANGUAGE') {
        return row.newPath.split(' \\| ', -1).collect { target ->
            String prefix = target.startsWith('zombies-addon/')
                    ? 'zombies-addon/src/main/resources/'
                    : 'src/main/resources/'
            if (!target.startsWith(prefix)) {
                throw new GradleException("Unexpected partitioned resource target: ${target}")
            }
            [target.startsWith('zombies-addon/') ? 'addon' : 'main', target.substring(prefix.length())]
        }
    }
    String prefix = row.owner == 'ZOMBIES_ADDON'
            ? 'zombies-addon/src/main/resources/'
            : 'src/main/resources/'
    if (!row.newPath.startsWith(prefix)) {
        throw new GradleException("Unexpected resource target path in physical overlay: ${row}")
    }
    [[row.owner == 'ZOMBIES_ADDON' ? 'addon' : 'main', row.newPath.substring(prefix.length())]]
}

