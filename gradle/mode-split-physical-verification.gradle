tasks.register('verifyModeSplitRound1TargetGuards') {
    group = 'verification'
    description = 'Prove target artifact gates reject temporary empty JARs before Round 2 creates real artifacts.'
    doLast {
        File emptyJar = new File(temporaryDir, 'empty.jar')
        emptyJar.parentFile.mkdirs()
        new JarOutputStream(new FileOutputStream(emptyJar)).close()
        boolean rejected = false
        try {
            validateSplitJar(emptyJar, 'Temporary empty JAR')
        } catch (GradleException expected) {
            rejected = true
        }
        if (!rejected) {
            throw new GradleException('Target metadata gate unexpectedly accepted an empty JAR')
        }
        File resourceLeakJar = new File(temporaryDir, 'resource-leak.jar')
        new JarOutputStream(new FileOutputStream(resourceLeakJar)).withCloseable { jar ->
            jar.putNextEntry(new JarEntry('META-INF/services/example.Service'))
            jar.write('com.cdp.codpattern.app.zombies.bootstrap.ZombiesBootstrap'
                    .getBytes(StandardCharsets.UTF_8))
            jar.closeEntry()
        }
        Map<String, List<String>> resourceLeak = scanJarForAddonReferences(
                resourceLeakJar,
                ['com/cdp/codpattern/app/zombies/bootstrap/ZombiesBootstrap'] as Set)
        if (resourceLeak.resources.size() != 1 || !resourceLeak.bytecode.isEmpty()) {
            throw new GradleException(
                    "Target content fence did not detect an addon implementation in metadata: ${resourceLeak}")
        }
        for (String requiredTask : [
                'verifySplitArtifactOwnership',
                'verifySplitModMetadata',
                'verifySplitResourcePartition',
                'verifySplitBytecodeFence',
                'verifySplitMainApiBaseline',
                'runCoreOnlyFreshJvm',
                'runCombinedSplitCompat',
                'runSplitPackagingGate']) {
            if (tasks.findByName(requiredTask) == null) {
                throw new GradleException("Missing prepared target verification task: ${requiredTask}")
            }
        }
        println 'Round 1 target guards passed: 8 target tasks exist, empty JAR is rejected, ' +
                'and metadata addon references are detected'
    }
}

