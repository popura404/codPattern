tasks.register('verifySplitServerSmokeLogs') {
    group = 'verification'
    description = 'Verify isolated main-only and combined dedicated-server startup/shutdown evidence.'
    def mainLatest = layout.projectDirectory.file('run-main-only/logs/latest.log')
    def mainDebug = layout.projectDirectory.file('run-main-only/logs/debug.log')
    def combinedLatest = layout.projectDirectory.file('run-combined/logs/latest.log')
    def combinedDebug = layout.projectDirectory.file('run-combined/logs/debug.log')
    inputs.files(mainLatest, mainDebug, combinedLatest, combinedDebug)
    doLast {
        Closure<String> readRequiredLog = { File log, String label ->
            if (!log.isFile() || log.length() == 0L) {
                throw new GradleException("Missing ${label}: ${log}")
            }
            log.getText('UTF-8')
        }
        String mainText = readRequiredLog(mainLatest.asFile, 'main-only latest.log')
        String mainDebugText = readRequiredLog(mainDebug.asFile, 'main-only debug.log')
        String combinedText = readRequiredLog(combinedLatest.asFile, 'combined latest.log')
        String combinedDebugText = readRequiredLog(combinedDebug.asFile, 'combined debug.log')

        for (Map<String, String> evidence : [
                [label: 'main-only', latest: mainText, debug: mainDebugText],
                [label: 'combined', latest: combinedText, debug: combinedDebugText]
        ]) {
            for (String required : ['Done (', 'Stopping server', 'All dimensions are saved']) {
                if (!evidence.latest.contains(required)) {
                    throw new GradleException(
                            "${evidence.label} dedicated-server log is missing '${required}'")
                }
            }
            for (String forbidden : [
                    'ClassNotFoundException', 'NoClassDefFoundError',
                    'InvalidDist', 'Attempted to load class net/minecraft/client'
            ]) {
                if (evidence.latest.contains(forbidden) || evidence.debug.contains(forbidden)) {
                    throw new GradleException(
                            "${evidence.label} dedicated-server log contains '${forbidden}'")
                }
            }
        }
        if (!mainDebugText.contains('with {codpattern} mods - versions')
                || mainDebugText.contains('with {codpattern_zombies} mods - versions')) {
            throw new GradleException('Main-only server did not discover exactly the main mod container')
        }
        if (!combinedDebugText.contains('with {codpattern} mods - versions')
                || !combinedDebugText.contains('with {codpattern_zombies} mods - versions')) {
            throw new GradleException('Combined server did not discover both split mod containers')
        }
        println 'Dedicated-server smoke logs passed: isolated main-only and combined startup/shutdown'
    }
}

