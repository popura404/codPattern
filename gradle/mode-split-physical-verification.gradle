tasks.register('verifySplitArtifactOwnership') {
    group = 'verification'
    description = 'Verify final main/addon JAR class and resource ownership against the Round 0 overlays.'
    inputs.files(splitPhysicalOverlay, splitResourceOverlay, splitPackageRelocations)
    doLast {
        requireTargetStage()
        File mainJar = requireSplitJar('modeSplitMainJar', 'Main reobfuscated JAR')
        File addonJar = requireSplitJar('modeSplitAddonJar', 'Addon reobfuscated JAR')
        Set<String> mainEntries = zipEntries(mainJar)
        Set<String> addonEntries = zipEntries(addonJar)

        List<Map> javaRows = readOverlayRows(splitPhysicalOverlay.asFile)
                .findAll { it.oldPath.startsWith('src/main/java/') }
        Set<String> expectedMainClasses = javaRows.findAll { it.owner == 'FUTURE_MAIN' }
                .collect(expectedClassEntry).toSet()
        Set<String> expectedAddonClasses = javaRows.findAll { it.owner == 'ZOMBIES_ADDON' }
                .collect(expectedClassEntry).toSet()
        Set<String> missingMain = expectedMainClasses - mainEntries
        Set<String> missingAddon = expectedAddonClasses - addonEntries
        Set<String> misplacedMain = expectedAddonClasses.intersect(mainEntries)
        Set<String> copiedMain = expectedMainClasses.intersect(addonEntries)
        if (!missingMain.isEmpty() || !missingAddon.isEmpty() || !misplacedMain.isEmpty() || !copiedMain.isEmpty()) {
            throw new GradleException("Split class ownership mismatch: missingMain=${missingMain}, " +
                    "missingAddon=${missingAddon}, addonInMain=${misplacedMain}, copiedMainInAddon=${copiedMain}")
        }

        List<List<String>> expectedResources = readOverlayRows(splitResourceOverlay.asFile)
                .collectMany(expectedResourceEntries)
        Set<String> missingMainResources = expectedResources.findAll { it[0] == 'main' }
                .collect { it[1] }.toSet() - mainEntries
        Set<String> missingAddonResources = expectedResources.findAll { it[0] == 'addon' }
                .collect { it[1] }.toSet() - addonEntries
        if (!missingMainResources.isEmpty() || !missingAddonResources.isEmpty()) {
            throw new GradleException("Split resource ownership mismatch: missingMain=${missingMainResources}, " +
                    "missingAddon=${missingAddonResources}")
        }
        println "Split artifact ownership passed: ${expectedMainClasses.size()} main classes, " +
                "${expectedAddonClasses.size()} addon classes, ${expectedResources.size()} resource targets"
    }
}

tasks.register('verifySplitRound2SourceOwnership') {
    group = 'verification'
    description = 'Verify the Round 2 Java source move without requiring Round 3 resource partitioning.'
    inputs.files(splitPhysicalOverlay, splitPackageRelocations)
    doLast {
        List<Map> javaRows = readOverlayRows(splitPhysicalOverlay.asFile)
                .findAll { it.oldPath.startsWith('src/main/java/') }
        List<Map> addonRows = javaRows.findAll { it.owner == 'ZOMBIES_ADDON' }
        if (addonRows.size() != 151) {
            throw new GradleException("Expected 151 frozen addon source rows, found ${addonRows.size()}")
        }
        List<String> staleRootSources = addonRows.findAll { file(it.oldPath).exists() }*.oldPath
        List<String> missingAddonSources = addonRows.collect { relocatedJavaPath(it.newPath) }
                .findAll { !physicalSplitPath(it).isFile() }
        if (!staleRootSources.isEmpty() || !missingAddonSources.isEmpty()) {
            throw new GradleException("Round 2 source move mismatch: staleRoot=${staleRootSources}, " +
                    "missingAddon=${missingAddonSources}")
        }

        Set<String> rootRelative = fileTree('src/main/java') { include '**/*.java' }.files.collect { source ->
            file('src/main/java').toPath().relativize(source.toPath()).toString().replace('\\', '/')
        }.toSet()
        Project addonProject = rootProject.findProject(':zombies-addon')
        if (addonProject == null) {
            throw new GradleException('Round 2 source ownership requires :zombies-addon')
        }
        File addonJavaRoot = addonProject.file('src/main/java')
        Set<String> addonRelative = addonProject.fileTree('src/main/java') {
            include '**/*.java'
        }.files.collect { source ->
            addonJavaRoot.toPath().relativize(source.toPath()).toString().replace('\\', '/')
        }.toSet()
        Set<String> copiedMain = rootRelative.intersect(addonRelative)
        if (!copiedMain.isEmpty()) {
            throw new GradleException("Addon source tree copies main-owned source paths: ${copiedMain}")
        }
        if (rootRelative.size() != 490 || addonRelative.size() != 154) {
            throw new GradleException("Round 2 Java source counts drifted: main=${rootRelative.size()}, " +
                    "addon=${addonRelative.size()}")
        }
        Set<String> expectedAddon = addonRows.collect { row ->
            relocatedJavaPath(row.newPath).substring('zombies-addon/src/main/java/'.length())
        }.toSet()
        expectedAddon.addAll([
                'com/cdp/codpattern/zombiesaddon/ZombiesAddon.java',
                'com/cdp/codpattern/zombiesaddon/ZombiesAddonConstants.java',
                'com/cdp/codpattern/zombiesaddon/ZombiesAddonCompatibility.java'
        ])
        if (addonRelative != expectedAddon) {
            throw new GradleException("Addon source inventory mismatch: missing=${expectedAddon - addonRelative}, " +
                    "unexpected=${addonRelative - expectedAddon}")
        }
        println 'Round 2 source ownership passed: 490 main sources, 151 moved addon sources, 3 addon entry/support sources'
    }
}

tasks.register('verifySplitRound2ClassOwnership') {
    group = 'verification'
    description = 'Verify split JAR class ownership without requiring Round 3 resource partitioning.'
    inputs.files(splitPhysicalOverlay, splitPackageRelocations)
    doLast {
        requireTargetStage()
        File mainJar = requireSplitJar('modeSplitMainJar', 'Main reobfuscated JAR')
        File addonJar = requireSplitJar('modeSplitAddonJar', 'Addon reobfuscated JAR')
        Set<String> mainEntries = zipEntries(mainJar)
        Set<String> addonEntries = zipEntries(addonJar)
        List<Map> javaRows = readOverlayRows(splitPhysicalOverlay.asFile)
                .findAll { it.oldPath.startsWith('src/main/java/') }
        Set<String> expectedMainClasses = javaRows.findAll { it.owner == 'FUTURE_MAIN' }
                .collect(expectedClassEntry).toSet()
        Set<String> expectedAddonClasses = javaRows.findAll { it.owner == 'ZOMBIES_ADDON' }
                .collect(expectedClassEntry).toSet()
        Set<String> newAddonClasses = [
                'com/cdp/codpattern/zombiesaddon/ZombiesAddon.class',
                'com/cdp/codpattern/zombiesaddon/ZombiesAddonConstants.class',
                'com/cdp/codpattern/zombiesaddon/ZombiesAddonCompatibility.class'
        ] as Set
        Set<String> missingMain = expectedMainClasses - mainEntries
        Set<String> missingAddon = (expectedAddonClasses + newAddonClasses) - addonEntries
        Set<String> addonInMain = (expectedAddonClasses + newAddonClasses).intersect(mainEntries)
        Set<String> copiedMain = expectedMainClasses.intersect(addonEntries)
        if (!missingMain.isEmpty() || !missingAddon.isEmpty() || !addonInMain.isEmpty()
                || !copiedMain.isEmpty()) {
            throw new GradleException("Round 2 class ownership mismatch: missingMain=${missingMain}, " +
                    "missingAddon=${missingAddon}, addonInMain=${addonInMain}, copiedMain=${copiedMain}")
        }
        println "Round 2 class ownership passed: ${expectedMainClasses.size()} main classes, " +
                "${expectedAddonClasses.size()} moved addon classes, 3 addon entry/support classes"
    }
}

tasks.register('verifySplitNoDuplicatePackages') {
    group = 'verification'
    description = 'Reject Java packages owned by both shipping artifacts.'
    doLast {
        requireTargetStage()
        File mainJar = requireSplitJar('modeSplitMainJar', 'Main reobfuscated JAR')
        File addonJar = requireSplitJar('modeSplitAddonJar', 'Addon reobfuscated JAR')
        Closure<Set<String>> packages = { File artifact ->
            zipEntries(artifact).findAll { entry ->
                entry.endsWith('.class') && !entry.startsWith('META-INF/versions/')
                        && entry.contains('/') && entry != 'module-info.class'
            }.collect { entry ->
                entry.substring(0, entry.lastIndexOf('/')).replace('/', '.')
            }.toSet()
        }
        Set<String> duplicatePackages = packages(mainJar).intersect(packages(addonJar))
        if (!duplicatePackages.isEmpty()) {
            throw new GradleException("Split Java packages remain across shipping artifacts: ${duplicatePackages}")
        }
        println 'Split package ownership passed: main and addon JAR package sets are disjoint'
    }
}

tasks.register('verifySplitModMetadata') {
    group = 'verification'
    description = 'Verify independent Forge mod IDs and the permanent addon-to-main runtime dependency.'
    doLast {
        requireTargetStage()
        File mainJar = requireSplitJar('modeSplitMainJar', 'Main reobfuscated JAR')
        File addonJar = requireSplitJar('modeSplitAddonJar', 'Addon reobfuscated JAR')
        String mainMetadata = readZipEntry(mainJar, 'META-INF/mods.toml')
        String addonMetadata = readZipEntry(addonJar, 'META-INF/mods.toml')
        List<String> mainMods = tomlArrayBlocks(mainMetadata, 'mods')
        List<String> addonMods = tomlArrayBlocks(addonMetadata, 'mods')
        String mainMod = mainMods.find { tomlStringValue(it, 'modId') == 'codpattern' }
        String addonMod = addonMods.find { tomlStringValue(it, 'modId') == 'codpattern_zombies' }
        if (mainMod == null) {
            throw new GradleException('Main mods.toml does not declare modId="codpattern"')
        }
        if (addonMod == null) {
            throw new GradleException('Addon mods.toml does not declare modId="codpattern_zombies"')
        }
        String mainVersion = tomlStringValue(mainMod, 'version')
        String addonVersion = tomlStringValue(addonMod, 'version')
        if (mainVersion == null || addonVersion == null || mainVersion != addonVersion) {
            throw new GradleException(
                    "Main/addon lockstep version drift: main=${mainVersion}, addon=${addonVersion}")
        }
        List<String> addonDependencies = tomlArrayBlocks(
                addonMetadata, 'dependencies.codpattern_zombies')
        String mainDependency = addonDependencies.find {
            tomlStringValue(it, 'modId') == 'codpattern'
        }
        if (mainDependency == null
                || tomlBooleanValue(mainDependency, 'mandatory') != true
                || tomlStringValue(mainDependency, 'ordering') != 'AFTER'
                || tomlStringValue(mainDependency, 'side') != 'BOTH'
                || tomlStringValue(mainDependency, 'versionRange') != "[${addonVersion}]") {
            throw new GradleException(
                    'Addon mods.toml lacks the permanent exact-version mandatory/AFTER/BOTH codpattern dependency')
        }
        for (String requiredModId : ['forge', 'minecraft', 'tacz']) {
            String dependency = addonDependencies.find {
                tomlStringValue(it, 'modId') == requiredModId
            }
            if (dependency == null || tomlBooleanValue(dependency, 'mandatory') != true
                    || tomlStringValue(dependency, 'side') != 'BOTH') {
                throw new GradleException(
                        "Addon mods.toml lacks a direct mandatory/BOTH ${requiredModId} dependency")
            }
        }
        if (tomlArrayBlocks(mainMetadata, 'dependencies.codpattern').any {
            tomlStringValue(it, 'modId') == 'codpattern_zombies'
        }) {
            throw new GradleException('Main mods.toml must not depend on codpattern_zombies')
        }
        println "Split mod metadata passed: lockstep ${mainVersion}, exact mandatory main dependency, " +
                'and direct Forge/Minecraft/TaCZ dependencies'
    }
}

tasks.register('verifySplitResourcePartition') {
    group = 'verification'
    description = 'Reject duplicate shipping paths and enforce the separate addon language namespace.'
    doLast {
        requireTargetStage()
        File mainJar = requireSplitJar('modeSplitMainJar', 'Main reobfuscated JAR')
        File addonJar = requireSplitJar('modeSplitAddonJar', 'Addon reobfuscated JAR')
        Set<String> mainEntries = zipEntries(mainJar)
        Set<String> addonEntries = zipEntries(addonJar)
        Set<String> allowedPerJarMetadata = [
                'META-INF/MANIFEST.MF', 'META-INF/mods.toml', 'pack.mcmeta'
        ] as Set
        Set<String> duplicatePaths = mainEntries.intersect(addonEntries) - allowedPerJarMetadata
        if (!duplicatePaths.isEmpty()) {
            throw new GradleException("Unapproved duplicate paths across split JARs: ${duplicatePaths}")
        }
        List<String> locales = ['en_us', 'ja_jp', 'zh_cn', 'zh_tw']
        for (String locale : locales) {
            String mainLanguage = "assets/codpattern/lang/${locale}.json"
            String addonLanguage = "assets/codpattern_zombies/lang/${locale}.json"
            if (!mainEntries.contains(mainLanguage) || !addonEntries.contains(addonLanguage)) {
                throw new GradleException(
                        "Missing partitioned language resources: ${mainLanguage} / ${addonLanguage}")
            }
            if (addonEntries.contains(mainLanguage) || mainEntries.contains(addonLanguage)) {
                throw new GradleException("Language resource namespace leaked across artifacts for ${locale}")
            }
        }
        println 'Split resource partition passed: no unapproved duplicate paths and 4 language pairs isolated'
    }
}

