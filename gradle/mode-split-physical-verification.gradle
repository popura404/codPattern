tasks.register('verifyModeSplitNamedGameTestBaseline') {
    group = 'verification'
    description = 'Parse all named GameTest results and preserve the approved GT-001 disposition.'
    def results = splitOverlayDir.file('named-gametest-results.tsv')
    inputs.file(results)
    doLast {
        List<Map<String, String>> rows = results.asFile.readLines('UTF-8').findAll { raw ->
            !raw.isBlank() && !raw.startsWith('#')
        }.collect { raw ->
            String[] fields = raw.split('\t', -1)
            if (fields.length != 7) {
                throw new GradleException("Invalid named GameTest result row: ${raw}")
            }
            [name: fields[0], required: fields[4], result: fields[5], detail: fields[6]]
        }
        if (rows*.name.toSet().size() != 17 || rows.size() != 17) {
            throw new GradleException("Expected 17 unique named GameTests, found ${rows.size()}")
        }
        List<Map<String, String>> required = rows.findAll { it.required == 'true' }
        List<Map<String, String>> optional = rows.findAll { it.required == 'false' }
        List<Map<String, String>> failures = rows.findAll { it.result == 'FAIL' }
        if (required.size() != 2 || required.any { it.result != 'PASS' }) {
            throw new GradleException("Required GameTest baseline drift: ${required}")
        }
        if (optional.size() != 15 || optional.count { it.result == 'PASS' } != 14) {
            throw new GradleException("Optional GameTest baseline drift: ${optional}")
        }
        if (failures.size() != 1
                || failures[0].name != 'objectinteractionammoboxsyncstaggedprimarystackinplayerinventory'
                || failures[0].detail != 'ammo box interaction should succeed') {
            throw new GradleException("GT-001 named failure disposition drift: ${failures}")
        }
        println 'Named GameTest baseline passed: 2 required PASS, 14 optional PASS, GT-001 optional FAIL'
    }
}

tasks.register('verifyCombinedNamedGameTestResults') {
    group = 'verification'
    description = 'Run combined Forge GameTest and compare its 17 named terminal results with Round 0.'
    def baseline = splitOverlayDir.file('named-gametest-results.tsv')
    def latestLog = layout.projectDirectory.file('run-combined-gametest/logs/latest.log')
    inputs.file(baseline)
    inputs.file(latestLog)
    dependsOn tasks.named('runCombinedGameTestServer')
    dependsOn tasks.named('verifyModeSplitNamedGameTestBaseline')
    doLast {
        Map<String, Map<String, String>> expected = [:]
        baseline.asFile.readLines('UTF-8').findAll { raw ->
            !raw.isBlank() && !raw.startsWith('#')
        }.each { raw ->
            String[] fields = raw.split('\t', -1)
            if (fields.length != 7) {
                throw new GradleException("Invalid named GameTest baseline row: ${raw}")
            }
            expected[fields[0]] = [
                    required: fields[4] == 'true' ? 'REQUIRED' : 'OPTIONAL',
                    result: fields[5],
                    detail: fields[6]
            ]
        }

        File logFile = latestLog.asFile
        if (!logFile.isFile()) {
            throw new GradleException("Combined GameTest log is missing: ${logFile}")
        }
        String marker = 'CODEXPATTERN_GAMETEST_RESULT\t'
        List<Map<String, String>> actualRows = []
        logFile.readLines('UTF-8').each { raw ->
            int markerIndex = raw.indexOf(marker)
            if (markerIndex < 0) {
                return
            }
            String[] fields = raw.substring(markerIndex + marker.length()).split('\t', 4)
            if (fields.length != 4) {
                throw new GradleException("Invalid combined named GameTest record: ${raw}")
            }
            actualRows.add([
                    name: fields[0],
                    required: fields[1],
                    result: fields[2],
                    detail: fields[3]
            ])
        }
        if (actualRows.size() != 17 || actualRows*.name.toSet().size() != 17) {
            throw new GradleException(
                    "Expected 17 unique combined named GameTest results, found ${actualRows.size()}")
        }
        Map<String, Map<String, String>> actual = actualRows.collectEntries { row ->
            [(row.name): [required: row.required, result: row.result, detail: row.detail]]
        }
        if (actual.keySet() != expected.keySet()) {
            throw new GradleException(
                    "Combined named GameTest set drift: missing=${expected.keySet() - actual.keySet()}, " +
                            "unexpected=${actual.keySet() - expected.keySet()}")
        }
        List<String> drift = expected.keySet().sort().findAll { name -> expected[name] != actual[name] }
        if (!drift.isEmpty()) {
            throw new GradleException("Combined named GameTest result drift: " +
                    drift.collect { name -> "${name}: expected=${expected[name]}, actual=${actual[name]}" })
        }
        println 'Combined named GameTest results passed: 2 required PASS, 14 optional PASS, GT-001 optional FAIL'
    }
}

tasks.register('verifyModeSplitJavaExecOwners') {
    group = 'verification'
    description = 'Verify every compatibility JavaExec main class has one executable test owner.'
    def overlay = splitOverlayDir.file('test-ownership-overlay.tsv')
    inputs.file(overlay)
    inputs.files(fileTree('src/test/java') { include '**/*.java' })
    inputs.files(project(':zombies-addon').fileTree('src/test/java') { include '**/*.java' })
    doLast {
        Map<String, String> owners = [:]
        readOverlayRows(overlay.asFile).each { row ->
            if (!row.oldPath.endsWith('.java')) {
                return
            }
            String prefix = 'src/test/java/'
            if (!row.oldPath.startsWith(prefix)) {
                return
            }
            String className = row.oldPath.substring(prefix.length(), row.oldPath.length() - '.java'.length())
                    .replace('/', '.')
            owners[className] = row.owner
        }
        [
                [owner: 'FUTURE_MAIN_TEST', root: file('src/test/java')],
                [owner: 'ZOMBIES_ADDON_TEST', root: project(':zombies-addon').file('src/test/java')]
        ].each { physicalRoot ->
            if (!physicalRoot.root.isDirectory()) {
                return
            }
            fileTree(physicalRoot.root) { include '**/*.java' }.files.each { File source ->
                String relative = physicalRoot.root.toPath().relativize(source.toPath()).toString()
                        .replace('\\', '/')
                String className = relative.substring(0, relative.length() - '.java'.length())
                        .replace('/', '.')
                String previous = owners.put(className, physicalRoot.owner)
                if (previous != null && previous != physicalRoot.owner) {
                    throw new GradleException(
                            "Compatibility JavaExec source has conflicting owners: ${className}=" +
                                    "${previous}/${physicalRoot.owner}")
                }
            }
        }
        List<String> missing = []
        List<String> resolved = []
        rootProject.allprojects.each { Project candidateProject ->
            candidateProject.tasks.withType(JavaExec)
                    .findAll { it.group == 'verification' }
                    .each { JavaExec task ->
                String className = task.mainClass.orNull
                if (className == null || className.isBlank()) {
                    missing.add(task.path + ':<no-main-class>')
                } else if (!owners.containsKey(className)) {
                    missing.add(task.path + ':' + className)
                } else {
                    resolved.add(task.path + '=' + owners[className])
                }
            }
        }
        if (!missing.isEmpty()) {
            throw new GradleException("Compatibility JavaExec tasks without executable owner: ${missing}")
        }
        println "Compatibility JavaExec ownership passed: ${resolved.size()} tasks (${resolved.sort()})"
    }
}

