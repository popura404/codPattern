def sha256 = { File artifact ->
    MessageDigest digest = MessageDigest.getInstance('SHA-256')
    artifact.withInputStream { input ->
        byte[] buffer = new byte[8192]
        int read
        while ((read = input.read(buffer)) >= 0) {
            if (read > 0) {
                digest.update(buffer, 0, read)
            }
        }
    }
    digest.digest().encodeHex().toString()
}

def verificationRoots = { String propertyName, String defaultValue ->
    String configured = (findProperty(propertyName) ?: '').toString().trim()
    if (!configured.isEmpty()) {
        return configured
    }
    List<File> defaults = [file(defaultValue)]
    Project addonProject = rootProject.findProject(':zombies-addon')
    if (addonProject != null) {
        defaults.add(addonProject.file(defaultValue))
    }
    defaults*.absolutePath.join(File.pathSeparator)
}

def configureModeSplitVerificationRoots = { JavaExec task ->
        task.systemProperty 'modeSplit.productionJavaRoots',
                verificationRoots('modeSplitProductionJavaRoots', 'src/main/java')
        task.systemProperty 'modeSplit.productionResourceRoots',
                verificationRoots('modeSplitProductionResourceRoots', 'src/main/resources')
        task.systemProperty 'modeSplit.testJavaRoots',
                verificationRoots('modeSplitTestJavaRoots', 'src/test/java')
        task.systemProperty 'modeSplit.testResourceRoots',
                verificationRoots('modeSplitTestResourceRoots', 'src/test/resources')
        task.systemProperty 'modeSplit.mainClassRoots',
                verificationRoots('modeSplitMainClassRoots', 'build/classes/java/main')
}

