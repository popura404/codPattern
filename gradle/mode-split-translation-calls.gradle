tasks.register('runModeSplitTranslationCallCompat', JavaExec) {
    group = 'verification'
    description = 'Verify Java-side translation keys and ordered argument expressions against the Phase 0 baseline.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.cdp.codpattern.architecture.ModeSplitTranslationCallCompatTest'
    dependsOn tasks.named('testClasses')
}

tasks.register('emitModeSplitTranslationCallBaseline', JavaExec) {
    group = 'documentation'
    description = 'Print the current Java translation call count/order hashes for explicit review.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.cdp.codpattern.architecture.ModeSplitTranslationCallCompatTest'
    args '--emit-baseline'
    dependsOn tasks.named('testClasses')
}
