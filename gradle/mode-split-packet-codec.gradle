tasks.register('runModeSplitPacketCodecCompat', JavaExec) {
    group = 'verification'
    description = 'Verify the Phase 0 packet discriminator, direction, golden codec, and legacy decode baselines.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.cdp.codpattern.architecture.ModeSplitPacketCodecCompatTest'
    dependsOn tasks.named('testClasses')
}

tasks.register('emitModeSplitPacketCodecFixtures', JavaExec) {
    group = 'documentation'
    description = 'Print candidate packet golden fixtures for explicit review; does not overwrite the approved baseline.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.cdp.codpattern.architecture.ModeSplitPacketCodecCompatTest'
    args '--emit-fixtures'
    dependsOn tasks.named('testClasses')
}
