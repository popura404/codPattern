// Keep all manifest parsing lazy.  Ordinary main-mod commands must not read
// physical-addon manifests or require the addon tree merely to configure.
def modeSplitPhase7PhysicalOverlay =
        layout.projectDirectory.file('docs/mode-split/physical/round0/physical-ownership-overlay.tsv')
def modeSplitPhase7PackageRelocations =
        layout.projectDirectory.file('docs/mode-split/physical/round2/SPLIT_PACKAGE_RELOCATION_PROPOSAL.tsv')

def readModeSplitPhase7Rows = {
    File overlay = modeSplitPhase7PhysicalOverlay.asFile
    if (!overlay.isFile()) {
        throw new GradleException("Missing physical ownership overlay: ${overlay}")
    }
    overlay.readLines('UTF-8').findAll { rawLine ->
        !rawLine.isBlank() && !rawLine.startsWith('#')
    }.collect { rawLine ->
        String[] fields = rawLine.split('\t', -1)
        if (fields.length != 6) {
            throw new GradleException("Invalid physical ownership overlay row: ${rawLine}")
        }
        [owner: fields[0], oldPath: fields[1], newPath: fields[2], kind: fields[3]]
    }
}

def readModeSplitPhase7Relocations = {
    File relocations = modeSplitPhase7PackageRelocations.asFile
    if (!relocations.isFile()) {
        throw new GradleException("Missing package relocation map: ${relocations}")
    }
    Map<String, String> result = relocations.readLines('UTF-8').findAll { rawLine ->
        !rawLine.isBlank() && !rawLine.startsWith('#')
    }.collectEntries { rawLine ->
        String[] fields = rawLine.split('\t', -1)
        if (fields.length < 2) {
            throw new GradleException("Invalid package relocation row: ${rawLine}")
        }
        [(fields[0]): fields[1]]
    }
    if (result.size() != 18) {
        throw new GradleException("Expected 18 authorized package relocations, found ${result.size()}")
    }
    result
}

def modeSplitPhase7RelocatedPath = { String owner, String overlayPath, Map<String, String> relocations ->
    String prefix = 'zombies-addon/src/main/java/'
    if (owner != 'ZOMBIES_ADDON' || !overlayPath.startsWith(prefix) || !overlayPath.endsWith('.java')) {
        return overlayPath
    }
    String oldFqcn = overlayPath.substring(prefix.length(), overlayPath.length() - '.java'.length())
            .replace('/', '.')
    String relocatedFqcn = relocations[oldFqcn]
    relocatedFqcn == null ? overlayPath : prefix + relocatedFqcn.replace('.', '/') + '.java'
}

def modeSplitPhase7PhysicalSource = { String physicalPath ->
    String addonPrefix = 'zombies-addon/'
    if (physicalPath.startsWith(addonPrefix)) {
        Project addonProject = rootProject.findProject(':zombies-addon')
        if (addonProject == null) {
            throw new GradleException("Physical addon source requires :zombies-addon: ${physicalPath}")
        }
        return addonProject.file(physicalPath.substring(addonPrefix.length()))
    }
    file(physicalPath)
}

def modeSplitPhase7SourcesFor = { String owner ->
    providers.provider {
        Map<String, String> relocations = readModeSplitPhase7Relocations()
        readModeSplitPhase7Rows().findAll { row ->
            owner == 'COMPOSITION_SHIM'
                    ? row.kind == 'MAIN_ENTRY_REWRITE'
                    : row.kind == 'PRODUCTION_JAVA' && row.owner == owner
        }.collect { row ->
            String physicalPath = modeSplitPhase7RelocatedPath(owner, row.newPath, relocations)
            File source = modeSplitPhase7PhysicalSource(physicalPath)
            if (!source.isFile()) {
                throw new GradleException(
                        "Physical split source is missing for ${owner}: ${row.oldPath} -> ${physicalPath}")
            }
            source
        }.sort { left, right -> project.relativePath(left) <=> project.relativePath(right) }
    }
}

def modeSplitPhase7ClassPrefix = { File source ->
    String relative = project.relativePath(source).replace('\\', '/')
    String marker = 'src/main/java/'
    int markerIndex = relative.indexOf(marker)
    if (markerIndex < 0 || !relative.endsWith('.java')) {
        throw new GradleException("Unexpected Phase 7 Java source path: ${relative}")
    }
    relative.substring(markerIndex + marker.length(), relative.length() - '.java'.length())
}

def modeSplitMainOnlyClasses = layout.buildDirectory.dir('mode-split/phase7/main-only/classes')
def modeSplitAddonSupportClasses = layout.buildDirectory.dir('mode-split/phase7/addon-support/classes')
def modeSplitZombiesAgainstMainClasses = layout.buildDirectory.dir('mode-split/phase7/zombies-against-main/classes')
def modeSplitPhase7ProbeClasses = layout.buildDirectory.dir('mode-split/phase7/probe/classes')

tasks.register('compileModeSplitMainOnly', JavaCompile) {
    group = 'verification'
    description = 'Compile only final-manifest FUTURE_MAIN production sources with addon implementations absent.'
    source = files(modeSplitPhase7SourcesFor('FUTURE_MAIN'))
    classpath = sourceSets.main.compileClasspath
    destinationDirectory.set(modeSplitMainOnlyClasses)
    options.encoding = 'UTF-8'
    outputs.upToDateWhen { false }
    doFirst {
        delete(destinationDirectory.get().asFile)
        println "Phase 7 main-only compile: ${source.files.size()} FUTURE_MAIN Java sources"
    }
}

tasks.register('compileModeSplitPhase7Probe', JavaCompile) {
    group = 'verification'
    description = 'Compile the Phase 7 fresh-JVM probe without the ordinary full main or test outputs.'
    dependsOn tasks.named('compileModeSplitMainOnly')
    source = fileTree('src/test/java') {
        include 'com/cdp/codpattern/verification/phase7/MainOnlyVerificationBootstrap.java'
        include 'com/cdp/codpattern/verification/phase7/Phase7MainOnlyFreshJvmProbe.java'
    }
    classpath = files(modeSplitMainOnlyClasses) + sourceSets.main.compileClasspath
    destinationDirectory.set(modeSplitPhase7ProbeClasses)
    options.encoding = 'UTF-8'
    outputs.upToDateWhen { false }
    doFirst {
        delete(destinationDirectory.get().asFile)
    }
}

tasks.register('verifyModeSplitPhase7ClasspathFence') {
    group = 'verification'
    description = 'Verify the isolated main-only output contains no addon or composition-shim classes.'
    dependsOn tasks.named('compileModeSplitMainOnly')
    doLast {
        File outputRoot = modeSplitMainOnlyClasses.get().asFile
        def compiledClasses = fileTree(outputRoot) {
            include '**/*.class'
        }.files.collect { classFile ->
            outputRoot.toPath().relativize(classFile.toPath()).toString().replace('\\', '/')
                    .replaceAll(/\.class$/, '')
        }
        if (compiledClasses.isEmpty()) {
            throw new GradleException('Phase 7 main-only output contains no compiled classes')
        }
        if (hasZombiesAddon) {
            def forbiddenSources = []
            forbiddenSources.addAll(modeSplitPhase7SourcesFor('ZOMBIES_ADDON').get())
            forbiddenSources.addAll(modeSplitPhase7SourcesFor('COMPOSITION_SHIM').get())
            def forbiddenClassPrefixes = forbiddenSources.collect(modeSplitPhase7ClassPrefix)
            def leaks = compiledClasses.findAll { className ->
                forbiddenClassPrefixes.any { prefix -> className == prefix || className.startsWith(prefix + '$') }
            }
            if (!leaks.isEmpty()) {
                throw new GradleException("Addon or shim classes leaked into main-only output: ${leaks}")
            }
        }
        println "Phase 7 classpath fence: ${compiledClasses.size()} main-only class files, 0 addon/shim leaks"
    }
}

tasks.register('runModeSplitMainOnlyFreshJvm', JavaExec) {
    group = 'verification'
    description = 'Run the main-only bootstrap and external contributor rehearsal in a fresh JVM.'
    dependsOn tasks.named('compileModeSplitPhase7Probe')
    dependsOn tasks.named('verifyModeSplitPhase7ClasspathFence')
    classpath = files(modeSplitPhase7ProbeClasses, modeSplitMainOnlyClasses) + sourceSets.main.compileClasspath
    mainClass = 'com.cdp.codpattern.verification.phase7.Phase7MainOnlyFreshJvmProbe'
}

if (hasZombiesAddon) {
    tasks.register('compileModeSplitAddonSupport', JavaCompile) {
        group = 'verification'
        description = 'Compile new physical-addon identity support without changing the frozen 151-source baseline.'
        source = files(project(':zombies-addon').file(
                'src/main/java/com/cdp/codpattern/zombiesaddon/ZombiesAddonConstants.java'))
        classpath = sourceSets.main.compileClasspath
        destinationDirectory.set(modeSplitAddonSupportClasses)
        options.encoding = 'UTF-8'
        outputs.upToDateWhen { false }
        doFirst {
            delete(destinationDirectory.get().asFile)
        }
    }

    tasks.register('compileModeSplitZombiesAgainstMainOnly', JavaCompile) {
        group = 'verification'
        description = 'Compile Zombies addon sources only against public main-only output and external dependencies.'
        dependsOn tasks.named('compileModeSplitMainOnly')
        dependsOn tasks.named('compileModeSplitAddonSupport')
        source = files(modeSplitPhase7SourcesFor('ZOMBIES_ADDON'))
        classpath = files(modeSplitMainOnlyClasses, modeSplitAddonSupportClasses) + sourceSets.main.compileClasspath
        destinationDirectory.set(modeSplitZombiesAgainstMainClasses)
        options.encoding = 'UTF-8'
        outputs.upToDateWhen { false }
        doFirst {
            delete(destinationDirectory.get().asFile)
            println "Phase 7 addon compile: ${source.files.size()} ZOMBIES_ADDON Java sources against main-only output"
        }
    }

    tasks.register('runModeSplitPhase7BoundaryCompat') {
        group = 'verification'
        description = 'Run the addon-owned final ownership and two-stage topology gates.'
        dependsOn ':zombies-addon:runModeSplitPhase7BoundaryCompat'
    }

    tasks.register('runModeSplitPhase7') {
        group = 'verification'
        description = 'Run the logical split-readiness rehearsal against the current two-project physical topology.'
        dependsOn tasks.named('runModeSplitMainOnlyFreshJvm')
        dependsOn tasks.named('compileModeSplitZombiesAgainstMainOnly')
        dependsOn tasks.named('runModeSplitPhase7BoundaryCompat')
        dependsOn 'verifySplitRound2SourceOwnership'
        dependsOn 'verifySplitMainApiBaseline'
        dependsOn tasks.named('runModeSplitDependencyRatchet')
    }
}
